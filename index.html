<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>UCONVERT</title>
<meta name="description" content="문서, 전자책, 이미지, 오디오, 영상, 데이터, 압축 파일을 브라우저 안에서 바로 변환합니다. 파일은 서버로 올라가지 않습니다.">
<meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
<meta name="theme-color" content="#F2F4F8" media="(prefers-color-scheme: light)">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap">
<script src="/theme-init.js"></script>
</head>
<body>


<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <linearGradient id="lg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#4C6BFF"/><stop offset="1" stop-color="#1FB5A8"/></linearGradient>
    <linearGradient id="og" x1="0" y1="0" x2="1" y2="1"><stop offset="0" style="stop-color:var(--grad1)"/><stop offset="1" style="stop-color:var(--grad2)"/></linearGradient>
  </defs>
</svg>

<div class="wrap">
  <header>
    <div class="brand">
      <button class="logo" id="modeToggle" type="button" aria-label="UCONVERT · 변환과 도구 바꾸기">
        <svg class="mark" viewBox="0 0 64 64" aria-hidden="true">
        <rect width="64" height="64" rx="16" fill="url(#lg)"/>
        <path d="M42 22v11a10 10 0 0 1-20 0V17" fill="none" stroke="#fff" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
        <path d="M15 23l7-7 7 7" fill="none" stroke="#fff" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
        <circle cx="42" cy="17" r="3.5" fill="#fff"/>
      </svg>
        <span class="word" aria-hidden="true"><span class="u">U</span>C<span class="o"><svg viewBox="0 0 24 24" fill="none" stroke="url(#og)" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 12a8 8 0 0 1-13.7 5.6"/><path d="M4 12a8 8 0 0 1 13.7-5.6"/><path d="M17.7 2.6v4h-4"/><path d="M6.3 21.4v-4h4"/></svg></span>NVERT</span>
      </button>
      <nav class="modes" id="modes" aria-label="모드">
        <button type="button" data-mode="conv" aria-pressed="true">변환</button>
        <button type="button" data-mode="tool" aria-pressed="false">도구</button>
        <span class="bar" id="modeBar" aria-hidden="true"></span>
      </nav>
    </div>
    <div class="tools">
      <button class="ghost" id="openFormats" aria-expanded="false" aria-controls="sheet">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="4" y="4" width="6.5" height="6.5" rx="1.5"/><rect x="13.5" y="4" width="6.5" height="6.5" rx="1.5"/><rect x="4" y="13.5" width="6.5" height="6.5" rx="1.5"/><rect x="13.5" y="13.5" width="6.5" height="6.5" rx="1.5"/></svg>
        <span>지원 형식</span>
      </button>
      <div class="theme" role="group" aria-label="화면 테마">
        <span class="knob" id="knob"></span>
        <button id="t-light" aria-pressed="false" aria-label="라이트"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg></button>
        <button id="t-dark" aria-pressed="false" aria-label="다크"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1111.2 3a7 7 0 009.8 9.8z"/></svg></button>
      </div>
    </div>
  </header>

  <div class="app" id="capp">
    <div class="main">
      <label class="drop" id="drop" for="picker">
        <span class="plus"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg></span>
        <b>파일 추가</b>
        <input type="file" id="picker" multiple hidden>
      </label>
      <div class="q-head">
        <div class="q-title">
          <h2>변환 목록<span class="count" id="count"></span></h2>
          <label class="switch" title="변환이 모두 끝나면 결과를 자동으로 받아요 (여러 개면 ZIP 하나로)">
            <input type="checkbox" id="autoDl"><span class="track" aria-hidden="true"></span><span class="switch-label">끝나면 자동 받기</span>
          </label>
        </div>
        <div class="q-actions">
          <button class="btn" id="clear">완료 지우기</button>
          <button class="btn btn-zip" id="zipAll"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 4v11M7 10l5 5 5-5M5 20h14"/></svg><span>모두 받기</span></button>
          <button class="btn btn-primary" id="runAll">모두 변환</button>
        </div>
      </div>
      <ul class="rows scroll" id="rows"></ul>
    </div>
    <div class="divider" aria-hidden="true"></div>
    <aside class="panel" id="panel" aria-label="변환 설정"></aside>
  </div>

  <div class="app tapp" id="tapp" hidden>
    <div class="main">
      <nav class="tcats" id="tcats" aria-label="도구 갈래"></nav>
      <nav class="tnav" id="tnav" aria-label="도구"></nav>
      <div class="tbar" id="tbar" hidden></div>
      <div class="tstage scroll" id="tstage"></div>
    </div>
    <div class="divider" aria-hidden="true"></div>
    <aside class="panel" id="tpanel" aria-label="도구 설정"></aside>
  </div>
  <input type="file" id="tpicker" accept="application/pdf,.pdf" multiple hidden>
  <input type="file" id="wmPicker" accept="image/png,image/jpeg" hidden>
</div>

<div class="pscrim" id="pscrim"></div>
<div class="scrim" id="scrim"></div>
<aside class="sheet" id="sheet" aria-label="지원 형식" aria-hidden="true">
  <div class="sheet-head">
    <h2>지원 형식</h2>
    <button class="x" id="closeFormats" aria-label="닫기" style="padding:8px"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" style="width:18px;height:18px"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
  </div>
  <input class="search" id="search" type="search" placeholder="형식 찾기">
  <div class="cat-list scroll" id="cats"></div>
</aside>

<div class="overlay" id="overlay" aria-hidden="true">
  <div class="box"><span class="plus"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg></span>여기에 놓기</div>
</div>

<script type="module" src="/src/main.js"></script>
</body>
</html>
